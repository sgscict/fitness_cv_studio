<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Standalone Fitness Computer Vision Studio: Real-time MediaPipe Pose Detection, Rep Counting, Joint Angle Safety, & Form Feedback.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FF5C38">
  <title>Fitness Computer Vision Studio</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #0B0D17;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #0B0D17; color: #FFFFFF;
      transition: opacity .3s ease;
    }
    #splash .logo {
      font-size: 42px;
      line-height: 1;
    }
    #splash .name {
      font-weight: 900;
      letter-spacing: 2px;
      color: #FF5C38;
      font-size: 20px;
    }
    #splash .sub {
      color: #94A3B8;
      font-size: 13px;
      font-weight: 500;
    }
    #splash .bar {
      width: 140px; height: 4px; border-radius: 4px; background: #1E293B; overflow: hidden;
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: linear-gradient(90deg, #FF5C38, #06B6D4);
      border-radius: 4px; animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo">🎥</div>
    <div class="name">FITNESS CV STUDIO</div>
    <div class="sub">Loading On-Device MediaPipe Pose Engine…</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script type="module" src="pose_bridge.js?v=2"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
